name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: TS package (bun)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsc --noEmit
        working-directory: vsreact/js
      - run: bun test
        working-directory: vsreact/js
      # js-posthog resolves @vsreact/core types through dist/ — build it first.
      - run: bun run build:dist
        working-directory: vsreact/js
      - run: bunx tsc --noEmit
        working-directory: vsreact/js-posthog
      - run: bun test
        working-directory: vsreact/js-posthog
      # synth imports @vsreact/posthog, which also resolves through dist/.
      - run: bun run build:dist
        working-directory: vsreact/js-posthog
      # The example UIs are real apps against the current SDK (resolved through
      # dist/, built above) — build and typecheck each (build first: it
      # generates src/_assets.ts).
      - name: Example UIs
        run: |
          for d in vsreact/examples/*/ui; do
            echo "== $d"
            (cd "$d" && bun run build && bunx tsc --noEmit)
          done

  native:
    name: C++ module (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-8vcpu-windows-2025
            experimental: false
          - os: blacksmith-6vcpu-macos-latest
            # macOS is compile+test coverage we don't develop on — informative,
            # not gating, until it has burned in.
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: "8.0.4"
          path: JUCE
      - name: Configure
        run: cmake -S ci -B ci/build -DJUCE_SOURCE_DIR="${{ github.workspace }}/JUCE" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build ci/build --config Release --parallel 4
      # ExampleBundleTests/ExampleInteractionTests skip any bundle that isn't
      # built — build them all so those tests actually gate.
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # The bundler resolves @vsreact/core and @vsreact/posthog through dist/.
      - run: bun run build:dist
        working-directory: vsreact/js
      - run: bun run build:dist
        working-directory: vsreact/js-posthog
      - name: Build example UI bundles
        shell: bash
        run: |
          for d in vsreact/examples/*/ui; do
            echo "== $d"
            (cd "$d" && bun run build)
          done
      - name: Test
        run: ctest --test-dir ci/build -C Release --output-on-failure

  # Host-level validation: build the gain example as a real VST3 and run it
  # through pluginval at max strictness — editor open/close, state
  # save/restore, bus layouts, threading. The unit suite drives a synthetic
  # ShadowTree; this is the check that the plugin behaves as a plugin.
  pluginval:
    name: pluginval (VST3, Windows)
    # GitHub-hosted, not blacksmith: the editor tests create real HWNDs, and
    # on the blacksmith image pluginval segfaults the moment the Editor test
    # starts (no interactive window station). Passes on windows-latest — the
    # same runner JUCE's own CI validates on — and locally.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: "8.0.4"
          path: JUCE
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # The editor loads the JS bundle from the compiled-in dev path — build
      # it so pluginval's editor tests exercise the real UI, not the error
      # overlay. The bundler resolves @vsreact/core through dist/.
      - run: bun run build:dist
        working-directory: vsreact/js
      - run: bun run build:dist
        working-directory: vsreact/js-posthog
      - run: bun run build
        working-directory: vsreact/examples/gain/ui
      # No explicit generator: windows-latest moved past VS 2022 (naming the
      # old generator fails outright); CMake's default picks whatever Visual
      # Studio the runner actually has.
      - name: Configure
        run: cmake -S vsreact/examples/gain -B build-gain -DJUCE_SOURCE_DIR="${{ github.workspace }}/JUCE"
      - name: Build VST3
        run: cmake --build build-gain --target GainExample_VST3 --config Release --parallel 4
      - name: Fetch pluginval
        shell: bash
        run: |
          curl -sL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip"
          unzip -o pluginval.zip
      - name: Validate
        shell: bash
        run: |
          ./pluginval.exe --strictness-level 5 --verbose --timeout-ms 120000 --validate \
            "build-gain/GainExample_artefacts/Release/VST3/VSReacT Gain.vst3"
