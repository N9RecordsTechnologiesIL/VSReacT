name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: TS package (bun)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsc --noEmit
        working-directory: vsreact/js
      - run: bun test
        working-directory: vsreact/js
      # js-posthog resolves @vsreact/core types through dist/ — build it first.
      - run: bun run build:dist
        working-directory: vsreact/js
      - run: bunx tsc --noEmit
        working-directory: vsreact/js-posthog
      - run: bun test
        working-directory: vsreact/js-posthog
      # The scaffolder pins a module tag and an npm range that must track the
      # packages above — nothing else in CI touches it.
      - run: bun test
        working-directory: vsreact/create
      # synth imports @vsreact/posthog, which also resolves through dist/.
      - run: bun run build:dist
        working-directory: vsreact/js-posthog
      # The example UIs are real apps against the current SDK (resolved through
      # dist/, built above) — build and typecheck each (build first: it
      # generates src/_assets.ts).
      - name: Example UIs
        run: |
          for d in vsreact/examples/*/ui; do
            echo "== $d"
            # `bun test` exits non-zero when it finds no files, so only run it
            # for the examples that carry tests (compressor's curve maths) —
            # and let a real failure through.
            (
              cd "$d" && bun run build && bunx tsc --noEmit
              if ls src/*.test.* >/dev/null 2>&1; then bun test; fi
            )
          done

  native:
    name: C++ module (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows/macOS pin JUCE 8.0.4 deliberately: it's the oldest JUCE
          # we claim to support, so these jobs double as the compat check.
          - os: blacksmith-8vcpu-windows-2025
            juce_ref: "8.0.4"
            experimental: false
          - os: blacksmith-6vcpu-macos-latest
            # Gating since 0.0.30: it burned in green across the 0.0.28/0.0.29
            # cycles, and advisory-only meant a macOS break could land silently.
            juce_ref: "8.0.4"
            experimental: false
          - os: blacksmith-4vcpu-ubuntu-2404
            # Advisory until it burns in, the same path macOS took. Exists so
            # the site's Linux claim is tested rather than aspirational.
            experimental: true
            # 8.0.14, not 8.0.4: JUCE 8.0.4's Linux glyph fallback segfaults
            # in SimpleShapedText::shape when a custom font lacks a glyph for
            # a non-ASCII character (the channel example's "·" readout).
            # Verified fixed by 8.0.14; Linux support therefore starts there.
            juce_ref: "8.0.14"
            # No display on a CI runner; JUCE's GUI init wants one even though
            # every test paints offscreen.
            test_wrapper: xvfb-run -a
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: ${{ matrix.juce_ref }}
          path: JUCE
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config xvfb fonts-dejavu-core \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev
      - name: Configure
        run: cmake -S ci -B ci/build -DJUCE_SOURCE_DIR="${{ github.workspace }}/JUCE" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build ci/build --config Release --parallel 4
      # ExampleBundleTests/ExampleInteractionTests skip any bundle that isn't
      # built — build them all so those tests actually gate.
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # The bundler resolves @vsreact/core and @vsreact/posthog through dist/.
      - run: bun run build:dist
        working-directory: vsreact/js
      - run: bun run build:dist
        working-directory: vsreact/js-posthog
      - name: Build example UI bundles
        shell: bash
        run: |
          for d in vsreact/examples/*/ui; do
            echo "== $d"
            (cd "$d" && bun run build)
          done
      - name: Test
        shell: bash
        run: |
          if ! ${{ matrix.test_wrapper }} ctest --test-dir ci/build -C Release --output-on-failure; then
            # Reading a job's log requires auth even on a public repo, but
            # annotations are public — put the failure where the run page
            # (and an unauthenticated API) can show it. FAIL lines when the
            # suite got that far; ctest's ***Exception and the log tail when
            # the binary died before printing a summary.
            LOG=ci/build/Testing/Temporary/LastTest.log
            { grep -E "FAIL:|!!! Test|\*\*\*" "$LOG" 2>/dev/null | head -4; tail -6 "$LOG" 2>/dev/null; } \
              | head -10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

  # Host-level validation: build the gain example as a real VST3 and run it
  # through pluginval at max strictness — editor open/close, state
  # save/restore, bus layouts, threading. The unit suite drives a synthetic
  # ShadowTree; this is the check that the plugin behaves as a plugin.
  pluginval:
    name: pluginval (VST3, Windows)
    # GitHub-hosted, not blacksmith: the editor tests create real HWNDs, and
    # on the blacksmith image pluginval segfaults the moment the Editor test
    # starts (no interactive window station). Passes on windows-latest — the
    # same runner JUCE's own CI validates on — and locally.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: "8.0.4"
          path: JUCE
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # The editor loads the JS bundle from the compiled-in dev path — build
      # it so pluginval's editor tests exercise the real UI, not the error
      # overlay. The bundler resolves @vsreact/core through dist/.
      - run: bun run build:dist
        working-directory: vsreact/js
      - run: bun run build:dist
        working-directory: vsreact/js-posthog
      - run: bun run build
        working-directory: vsreact/examples/gain/ui
      # No explicit generator: windows-latest moved past VS 2022 (naming the
      # old generator fails outright); CMake's default picks whatever Visual
      # Studio the runner actually has.
      - name: Configure
        run: cmake -S vsreact/examples/gain -B build-gain -DJUCE_SOURCE_DIR="${{ github.workspace }}/JUCE"
      - name: Build VST3
        run: cmake --build build-gain --target GainExample_VST3 --config Release --parallel 4
      - name: Fetch pluginval
        shell: bash
        run: |
          curl -sL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip"
          unzip -o pluginval.zip
      - name: Validate
        shell: bash
        run: |
          ./pluginval.exe --strictness-level 5 --verbose --timeout-ms 120000 --validate \
            "build-gain/GainExample_artefacts/Release/VST3/VSReacT Gain.vst3"

  # The AU twin of the pluginval job: build the gain example as an Audio Unit
  # and run it through auval, Apple's own validator (open/render/state/
  # properties). This is what makes "AU" a tested claim rather than "JUCE
  # supports it, so probably".
  auval:
    name: auval (AU, macOS)
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: "8.0.4"
          path: JUCE
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # The editor loads the JS bundle from the compiled-in dev path — build
      # it so auval's open/initialize passes exercise the real UI.
      - run: bun run build:dist
        working-directory: vsreact/js
      - run: bun run build:dist
        working-directory: vsreact/js-posthog
      - run: bun run build
        working-directory: vsreact/examples/gain/ui
      - name: Configure
        run: cmake -S vsreact/examples/gain -B build-gain -DJUCE_SOURCE_DIR="${{ github.workspace }}/JUCE" -DCMAKE_BUILD_TYPE=Release
      - name: Build AU
        run: cmake --build build-gain --target GainExample_AU --config Release --parallel 4
      - name: Validate
        run: |
          # auval only sees installed components, and the registrar caches —
          # install to the user domain and force a rescan before validating.
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build-gain/GainExample_artefacts/Release/AU/VSReacT Gain.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          # type aufx (effect), subtype = PLUGIN_CODE, manufacturer = PLUGIN_MANUFACTURER_CODE
          auval -v aufx Vsg1 Vsrt
