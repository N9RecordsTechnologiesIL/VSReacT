name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: TS package (bun)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsc --noEmit
        working-directory: vsreact/js
      - run: bun test
        working-directory: vsreact/js
      # js-posthog resolves @vsreact/core types through dist/ — build it first.
      - run: bun run build:dist
        working-directory: vsreact/js
      - run: bunx tsc --noEmit
        working-directory: vsreact/js-posthog
      - run: bun test
        working-directory: vsreact/js-posthog
      # The example UIs are real apps against the current SDK (resolved through
      # dist/, built above) — build and typecheck each (build first: it
      # generates src/_assets.ts).
      - name: Example UIs
        run: |
          for d in vsreact/examples/*/ui; do
            echo "== $d"
            (cd "$d" && bun run build && bunx tsc --noEmit)
          done

  native:
    name: C++ module (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-8vcpu-windows-2025
            experimental: false
          - os: blacksmith-6vcpu-macos-latest
            # macOS is compile+test coverage we don't develop on — informative,
            # not gating, until it has burned in.
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: "8.0.4"
          path: JUCE
      - name: Configure
        run: cmake -S ci -B ci/build -DJUCE_SOURCE_DIR="${{ github.workspace }}/JUCE" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build ci/build --config Release --parallel 4
      # ExampleBundleTests/ExampleInteractionTests skip any bundle that isn't
      # built — build them all so those tests actually gate.
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # The bundler resolves @vsreact/core through dist/ — build it first.
      - run: bun run build:dist
        working-directory: vsreact/js
      - name: Build example UI bundles
        shell: bash
        run: |
          for d in vsreact/examples/*/ui; do
            echo "== $d"
            (cd "$d" && bun run build)
          done
      - name: Test
        run: ctest --test-dir ci/build -C Release --output-on-failure
