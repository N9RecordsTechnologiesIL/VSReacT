# Tag vX.Y.Z → publish the `vsreact` package to the npm registry and
# create a GitHub release carrying the tarball (versioned + stable names).

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install workspace
        run: bun install

      - name: Build dist (compiled ESM + .d.ts)
        working-directory: vsreact/js
        run: bun run build:dist

      - name: Pack @vsreact/core
        working-directory: vsreact/js
        run: |
          npm pack
          cp vsreact-core-[0-9]*.tgz vsreact-core.tgz

      - name: Publish to npm
        working-directory: vsreact/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping registry publish."
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@vsreact/core@$VERSION" version >/dev/null 2>&1; then
            echo "@vsreact/core@$VERSION already on the registry — skipping."
            exit 0
          fi
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "VSReacT $GITHUB_REF_NAME" \
            --notes "## vsreact $GITHUB_REF_NAME

          Install the UI package:

          \`\`\`sh
          bun add @vsreact/core   # or npm install / yarn add / pnpm add
          \`\`\`

          Fetch the native JUCE module with CMake:

          \`\`\`cmake
          include(FetchContent)
          FetchContent_Declare(vsreact
            GIT_REPOSITORY https://github.com/${GITHUB_REPOSITORY}.git
            GIT_TAG        $GITHUB_REF_NAME
            SOURCE_SUBDIR  vsreact)
          FetchContent_MakeAvailable(vsreact)
          \`\`\`

          Docs: https://vsreact.n9records.com/docs" \
            vsreact/js/vsreact-core-[0-9]*.tgz \
            "vsreact/js/vsreact-core.tgz#vsreact-core.tgz (stable name — latest)"
