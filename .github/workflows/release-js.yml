# Tag vX.Y.Z → publish the `vsreact` package to the npm registry and
# create a GitHub release carrying the tarball (versioned + stable names).

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install workspace
        run: bun install

      - name: Build dist (compiled ESM + .d.ts)
        working-directory: vsreact/js
        run: bun run build:dist

      - name: Pack @vsreact/core
        working-directory: vsreact/js
        run: |
          npm pack
          cp vsreact-core-[0-9]*.tgz vsreact-core.tgz

      - name: Build + pack @vsreact/posthog
        working-directory: vsreact/js-posthog
        run: |
          bun run build:dist
          npm pack
          cp vsreact-posthog-[0-9]*.tgz vsreact-posthog.tgz

      - name: Pack create-vsreact
        working-directory: vsreact/create
        run: |
          npm pack
          cp create-vsreact-[0-9]*.tgz create-vsreact.tgz

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping registry publish."
            exit 0
          fi
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          for dir in vsreact/js vsreact/js-posthog vsreact/create; do
            NAME=$(node -p "require('./$dir/package.json').name")
            VERSION=$(node -p "require('./$dir/package.json').version")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already on the registry — skipping."
              continue
            fi
            # npm view can 404 while a fresh publish is still propagating, so
            # a publish conflict here is a skip, not a failure.
            set +e
            OUTPUT=$(cd "$dir" && npm publish --access public 2>&1)
            CODE=$?
            set -e
            echo "$OUTPUT"
            if [ $CODE -ne 0 ]; then
              if echo "$OUTPUT" | grep -qi "previously published"; then
                echo "$NAME@$VERSION already published — continuing."
              else
                exit $CODE
              fi
            fi
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # what's-new from CHANGELOG.md (the "## X.Y.Z — date" section), then install
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver " " { on = 1; next }
            /^## / { on = 0 }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then printf '\n---\n\n' >> notes.md; fi
          cat >> notes.md <<EOF
          ### Install

          \`\`\`sh
          bun add @vsreact/core   # or npm install / yarn add / pnpm add
          \`\`\`

          Fetch the native JUCE module with CMake:

          \`\`\`cmake
          include(FetchContent)
          FetchContent_Declare(vsreact
            GIT_REPOSITORY https://github.com/${GITHUB_REPOSITORY}.git
            GIT_TAG        $GITHUB_REF_NAME
            SOURCE_SUBDIR  vsreact)
          FetchContent_MakeAvailable(vsreact)
          \`\`\`

          Docs: https://vsreact.n9records.com/docs
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "VSReacT $GITHUB_REF_NAME" \
            --notes-file notes.md \
            vsreact/js/vsreact-core-[0-9]*.tgz \
            "vsreact/js/vsreact-core.tgz#vsreact-core.tgz (stable name — latest)" \
            vsreact/js-posthog/vsreact-posthog-[0-9]*.tgz \
            "vsreact/js-posthog/vsreact-posthog.tgz#vsreact-posthog.tgz (stable name — latest)" \
            vsreact/create/create-vsreact-[0-9]*.tgz \
            "vsreact/create/create-vsreact.tgz#create-vsreact.tgz (stable name — latest)"
